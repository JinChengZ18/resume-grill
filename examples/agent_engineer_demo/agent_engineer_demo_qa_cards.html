<meta charset="utf-8">
<title>对抗性技术面试 · Agent 开发工程师（示例）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1c2430; --soft:#5b6675; --line:#e2e7ee;
    --accent:#2b4a7a; --accent-soft:#eef2f8;
    --good:#1f7a3d; --good-bg:#eef7f0; --good-line:#bfe0c8;
    --pass:#0f6ea3; --pass-bg:#eef6fb; --pass-line:#bfe0f0;
    --tell:#a52424; --tell-bg:#fbeeee; --tell-line:#efc9c9;
    --probe:#6a3fb0; --probe-bg:#f3eefb; --probe-line:#dbc9f0;
    --ask-bg:#fbfaf4; --ask-line:#e8e0c4;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#12161c; --card:#1b212a; --ink:#e6ebf2; --soft:#9aa6b4; --line:#2b333e;
      --accent:#7fa8e0; --accent-soft:#22303f;
      --good:#7fce97; --good-bg:#17281c; --good-line:#2c4a34;
      --pass:#78c2ea; --pass-bg:#152530; --pass-line:#294559;
      --tell:#ef9a9a; --tell-bg:#2a1818; --tell-line:#523030;
      --probe:#c3a3ef; --probe-bg:#221a30; --probe-line:#3f2f57;
      --ask-bg:#211f16; --ask-line:#463f27;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif;
    line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:0 auto;padding:0 16px 60px}
  header.top{position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line);padding:14px 16px 0;margin:0 0 8px}
  header.top .inner{max-width:920px;margin:0 auto}
  h1{font-size:19px;margin:0 0 2px;color:var(--accent)}
  .sub{font-size:12.5px;color:var(--soft);margin:0 0 10px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .tab{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:6px 14px;border-radius:20px;font-size:13.5px;cursor:pointer;font-weight:600}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--soft);
    padding:6px 12px;border-radius:20px;font-size:12.5px;cursor:pointer}
  .btn:hover{color:var(--ink)}
  .links{margin-left:auto;display:flex;gap:14px;font-size:12.5px}
  .links a{color:var(--accent);text-decoration:none}
  .links a:hover{text-decoration:underline}
  .profile{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin:14px 0}
  .profile h2{font-size:16px;margin:0 0 6px;color:var(--accent)}
  .rlink{font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;
    border:1px solid var(--accent);border-radius:14px;padding:2px 9px;margin-left:8px;white-space:nowrap}
  .rlink:hover{background:var(--accent-soft)}
  .profile p{margin:0 0 8px;font-size:14px}
  .ruler{font-size:13px;background:var(--accent-soft);border-left:3px solid var(--accent);
    padding:8px 12px;border-radius:0 6px 6px 0;color:var(--ink)}
  .flags{margin:10px 0 0;padding-left:0;list-style:none;font-size:13.3px}
  .flags li{position:relative;padding:4px 0 4px 20px;border-top:1px dashed var(--line)}
  .flags li:before{content:"\25B2";position:absolute;left:0;top:4px;color:var(--tell);font-size:10px}
  .strengths{margin:10px 0 0;padding-left:0;list-style:none;font-size:13.3px}
  .strengths li{position:relative;padding:4px 0 4px 20px;border-top:1px dashed var(--line)}
  .strengths li:before{content:"\2605";position:absolute;left:0;top:4px;color:var(--good);font-size:10px}
  .stitle{font-size:11.5px;font-weight:700;letter-spacing:.3px;margin:12px 0 0}
  .stitle.s-good{color:var(--good)} .stitle.s-flag{color:var(--tell)}
  .anchor{display:inline-block;font-weight:600;font-size:11px;color:var(--soft);background:var(--accent-soft);
    border:1px solid var(--line);border-radius:10px;padding:1px 8px;margin-left:8px;vertical-align:2px;white-space:normal;overflow-wrap:anywhere}
  .ladder{margin:0 16px 10px}
  .rung{font-size:13px;color:var(--ink);padding:6px 10px;margin:0 0 5px;background:var(--accent-soft);
    border:1px solid var(--line);border-radius:7px}
  .rung .lv{display:inline-block;font-weight:700;color:var(--accent);font-size:10.5px;margin-right:6px;letter-spacing:.3px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    margin:14px 0;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card-h{display:flex;gap:10px;align-items:flex-start;padding:13px 16px 6px}
  .badge{flex:none;background:var(--accent);color:#fff;font-weight:700;font-size:12.5px;
    padding:2px 9px;border-radius:7px;margin-top:2px}
  .badge.behav{background:var(--soft)}
  .card-h h3{margin:0;font-size:15.5px;line-height:1.4;min-width:0}
  .paired-answer{margin:10px 0 4px;padding:8px 12px;background:var(--good-bg);border:1px solid var(--good-line);border-radius:6px;font-size:14px}
  .paired-answer summary{cursor:pointer;color:var(--good);font-weight:600}
  .paired-answer p{margin:8px 0 2px;color:var(--ink)}
  .theme-probe,.theme-followups{margin:0 16px 14px}
  .theme-followups h4{margin:6px 0;color:var(--probe)}
  .theme-followup{padding:8px 12px;border-left:3px solid var(--probe);background:var(--probe-bg);border-radius:6px;margin:8px 0}
  .theme-followup p{margin:6px 0}
  .theme-followup .when{font-size:12px;color:var(--soft)}
  .ask{margin:0 16px 12px;padding:10px 12px;background:var(--ask-bg);
    border:1px solid var(--ask-line);border-radius:8px;font-size:14px}
  .ask .k{display:inline-block;font-weight:700;color:var(--accent);font-size:11.5px;
    letter-spacing:.3px;margin-right:6px;vertical-align:1px}
  details.ans{margin:0 16px 14px}
  details.ans>summary{cursor:pointer;list-style:none;font-size:12.5px;color:var(--soft);
    padding:5px 0;user-select:none;font-weight:600}
  details.ans>summary::-webkit-details-marker{display:none}
  details.ans>summary:before{content:"\25B8 ";color:var(--accent)}
  details.ans[open]>summary:before{content:"\25BE "}
  .blk{border:1px solid;border-radius:8px;padding:9px 12px;margin:8px 0;font-size:13.6px}
  .blk .bt{font-weight:700;font-size:11.5px;letter-spacing:.3px;margin-bottom:4px}
  .blk ul{margin:4px 0 0;padding-left:18px}
  .blk li{margin:3px 0}
  .blk p{margin:2px 0 0}
  .good{background:var(--good-bg);border-color:var(--good-line)} .good .bt{color:var(--good)}
  .pass{background:var(--pass-bg);border-color:var(--pass-line)} .pass .bt{color:var(--pass)}
  .pass li{list-style:none;position:relative;padding-left:18px} .pass li:before{content:"\2713";position:absolute;left:0;color:var(--pass);font-weight:700}
  .tell{background:var(--tell-bg);border-color:var(--tell-line)} .tell .bt{color:var(--tell)}
  .probe{background:var(--probe-bg);border-color:var(--probe-line)} .probe .bt{color:var(--probe)}
  .behav-note{font-size:13.3px;margin:0 16px 14px}
  .behav-note b{color:var(--accent)}
  .probes{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:14px 0;padding:6px 16px 12px}
  .probes>summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:14px;padding:8px 0;list-style:none}
  .probes>summary::-webkit-details-marker{display:none}
  .probes>summary:before{content:"\25B8 "}
  .probes[open]>summary:before{content:"\25BE "}
  .probes ul{margin:2px 0 0;padding-left:18px;font-size:13.3px}
  .probes li{margin:5px 0}
  .probes .pt{display:inline-block;font-weight:700;color:var(--probe);font-size:11px;
    background:var(--probe-bg);border:1px solid var(--probe-line);border-radius:5px;padding:0 5px;margin-right:5px}
  code,.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:.92em;
    background:var(--accent-soft);padding:0 3px;border-radius:3px}
  .hide{display:none}
  footer{font-size:12px;color:var(--soft);text-align:center;margin-top:24px}
  footer .brand{margin-top:4px;font-weight:600;color:var(--accent);opacity:.8;letter-spacing:.3px}
  /* Print / Save as PDF: light colours, A4, every candidate and every answer shown. */
  @media print{
    :root{--bg:#fff; --card:#fff; --ink:#1c2430; --soft:#5b6675; --line:#d6dce4;
      --accent:#2b4a7a; --accent-soft:#eef2f8;
      --good:#1f7a3d; --good-bg:#eef7f0; --good-line:#bfe0c8;
      --pass:#0f6ea3; --pass-bg:#eef6fb; --pass-line:#bfe0f0;
      --tell:#a52424; --tell-bg:#fbeeee; --tell-line:#efc9c9;
      --probe:#6a3fb0; --probe-bg:#f3eefb; --probe-line:#dbc9f0;
      --ask-bg:#fbfaf4; --ask-line:#e8e0c4;}
    @page{size:A4;margin:14mm 12mm}
    html,body{background:#fff;font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    header.top{position:static;border:0;padding:0 0 6px}
    #bar{display:none !important}
    .wrap{max-width:none;padding:0}
    section[data-sec].hide{display:block !important}
    section[data-sec] + section[data-sec]{break-before:page}
    .profile,.rung,.blk,.theme-followup,.ask{break-inside:avoid}
    .card{box-shadow:none}
  }
</style>

入量/custom metric 与高基数罚单的费用，诚实说出自托管 ClickHouse 的运维负担（TTL/分区/备份/升级）与损失的 Datadog 成熟能力"], "pass": ["user_id/api_key 不进 metric label，明确知道 cardinality 爆炸后果", "成本明细走明细表或 trace/log attribute，与聚合大盘分工清楚", "知道 Signoz 背后是 OTel+ClickHouse、采集经 Collector", "迁移能说出真实成本取舍，而非「开源不花钱就更好」一边倒"], "tell": "「都打上去方便查」；把 per-user 用量做成 Prometheus gauge；没听过 cardinality；把 Signoz 当装个 agent 的 SaaS、不知 ClickHouse 在其中的角色；ClickHouse 写在技能栏却讲不出它干什么。", "probe": "技能栏还写了 InfluxDB，为何监控里两个时序库并存？给一个真实 measurement 的 schema——tag 放什么、field 放什么，为什么 user_id 绝不能进 tag？"}, {"n": "Q3", "title": "异步阻塞隔离与 Cloud Run 长请求", "anchor": "项目一「FastAPI 异步」「优化含 LLM 推理的长耗时请求链路」，项目二「参与 Cloud Run 部署运行维护」", "ladder": [{"level": "L1 项目切入", "q": "一个请求从 FastAPI 的 async 路由到返回上游响应，整条链路哪些环节是 async、哪些是同步阻塞？点名你实际用的 HTTP 客户端和数据库驱动。"}, {"level": "L2 设计决策", "q": "转发上游你用 httpx，client 是每个请求新建还是全局复用？连接池的 max_connections、keep-alive、超时你设了没、设成多少、为什么？"}], "ask": "如果在 async 路由里误用了同步阻塞库（requests/psycopg2/time.sleep），单实例并发 50 个请求会发生什么、为什么？Cloud Run 上跑长耗时 LLM 请求，request timeout 设多少、单实例 concurrency 设几、为什么——把「平台层 concurrency」和「进程内 async 并发」这两层讲清楚。", "good": ["async 路由里跑同步阻塞会卡死整个事件循环，其余并发请求全被拖住；必须换异步驱动（httpx.AsyncClient/asyncpg），迫不得已用 run_in_executor 丢线程池", "httpx client 全局单例在 lifespan/startup 建、shutdown 关，靠连接池复用；用 httpx.Limits 配连接池规模（max_connections/max_keepalive_connections），用 httpx.Timeout 分别设 connect/read/write/pool 超时", "流式响应下 read timeout 要放宽或改 stream，否则长响应被误判超时", "Cloud Run 请求超时最长 60 分钟（默认 5 分钟）、container concurrency 默认 80；LLM 慢请求要调低 concurrency，因每请求占内存与上游连接，否则排队与 OOM", "平台层 concurrency 决定单实例同时接多少请求，进程内 async 并发是事件循环层，两层叠加；CPU 配额是否 always-allocated 影响后台任务与计算段", "Agent workflow latency 分段定位：用 Langfuse 看每次 LLM call 时延、用 trace span 拆各 tool 调用，常见瓶颈是多个 tool 串行而非 LLM 本身，改 asyncio.gather 并发并用 Semaphore 限并发防打爆上游 rate limit", "并发编排失败隔离用 gather(return_exceptions=True)/TaskGroup，每个 tool 包 asyncio.wait_for 单独超时，失败降级返回部分结果"], "pass": ["理解 async 路由里同步阻塞会卡死事件循环、拖垮整实例并发", "httpx 全局复用＋连接池＋分层超时", "说得出 Cloud Run concurrency/timeout 量级，并知道对 LLM 慢请求要调低 concurrency 的理由", "latency 会分段定位（Langfuse/trace span），而非一律甩锅 LLM"], "tell": "「全用 async，FastAPI 本身就是异步」却说不出客户端库名；每请求新建 AsyncClient 而不自知；把冷启动当成所有慢的原因；分不清平台层 concurrency 与进程内 async 并发；latency 笼统归给「LLM 推理慢没办法」。", "probe": "你说某个 tool 慢——你怎么确认是它的网络/上游慢，而不是它在排队等事件循环、或等某个共享连接池的锁？trace 里你具体看哪两个时间戳之差？"}, {"n": "Q4", "title": "Agent Skill 模块化与金融数字防幻觉", "anchor": "项目二 Sorin「可模块化打包的 Agent Skill 架构」「LLM 动态生成 Markdown 分析结果」", "ladder": [{"level": "L1 项目切入", "q": "Sorin 里你具体独立写了哪几个 Agent Tool、哪些代码是你的？先讲讲这个系统你负责的部分。"}, {"level": "L2 设计决策", "q": "一个 Skill 在你们系统里是什么形态的产物（pip 包／带清单的目录／DB 记录）？主 Agent 通过什么机制发现并加载它，是进程内 import、importlib 动态加载还是跨进程调用？"}], "ask": "金融场景最怕模型把价格、涨跌幅、市值这些数字编出来。你怎么保证 Markdown 输出里的数字确实来自 tool 拿到的真实数据、而不是模型顺口生成的？别说「prompt 里让它别编」——讲程序化机制。", "good": ["数字与叙述分离：tool 返回的结构化数值单独保存，展示的关键数字直接从数据层模板占位／后处理填充，而非让模型自由书写", "或对模型输出的数字做回校验：提取正文数字与 tool 数据比对，不一致则标注或重生成；数字可能被换算（百分比、单位）需做匹配", "坦承纯靠 prompt 约束与 temperature=0 不可靠，必须有输出侧的 grounding 校验这一层", "Skill 形态具体：带 manifest（skill.yaml/entry_points）的目录，声明 name/version/入口/所需 tool 与权限；主 Agent 扫描 registry 用 importlib 或 entry_points 发现加载；能讲依赖隔离与版本冲突取舍", "tool orchestration 用 function calling 提供 JSON schema，模型返回结构化 tool_call，先做 pydantic 参数校验再执行，结果回灌", "幻觉参数兜底：tool 内做业务校验（ticker 是否在已知集合、日期合法性），数据源返回结构化错误让模型改参而非整链挂掉，有重试上限防死循环", "输出正确性分两层评估：可客观校验部分（数字溯源通过率、tool 调用准确率、格式合法率）用测试集回归，主观分析质量用人工抽检/LLM-judge 并承认其局限"], "pass": ["有输出侧数字溯源／校验机制，不是纯 prompt 祈祷", "Skill 能说清打包格式＋发现机制＋加载入口，区别于「只是分了几个文件」", "tool 参数有 schema 校验，幻觉参数有兜底与恢复路径", "有某种客观评估，而非「跑通没报错就发」"], "tell": "答案停在「prompt 里强调只能用给定数据」「用了 temperature=0」；只重复「模块化/可复用」却说不出打包格式与发现机制；假设模型参数总对、tool 无校验直接透传；把「不报错」当成「结论正确」。", "probe": "给一个你真实发现过的错误案例——Agent 输出了看起来合理但实际错误的结论，你怎么发现、事后加了什么机制防再犯？如果一个都举不出来，你凭什么确定它一直是对的？"}, {"n": "Q5", "title": "Selector 评估三指标与回放命中验证", "anchor": "项目三「多维度 Selector 评估（结构相似度/语义相关性/噪声抗性）」「基于队列的 HTML 分层解析」", "ladder": [{"level": "L1 项目切入", "q": "这个抓取系统的完整流程走一遍——从一个 URL 进来到产出可执行 scraper，中间经过哪些步骤？"}, {"level": "L2 设计决策", "q": "「基于队列的 HTML 分层解析」入队的是 DOM 节点还是 HTML 字符串片段？什么条件下决定这一层就地切成一个 chunk，超长子树是硬截断还是递归下潜，祖先上下文怎么不丢？"}], "ask": "三个评估指标分别给出精确到可计算的定义——结构相似度拿什么和什么比、用什么距离（树编辑距离/路径重合）；语义相关性向量从哪来、和谁算余弦；噪声抗性扰动什么、如何量化「抗住了」。每个指标的判定阈值是多少、这阈值怎么标定出来的？另外生成的 selector 你回放到真实 DOM 验证命中数没有、命中 0 或命中多怎么处理？", "good": ["结构相似度＝目标元素与参考锚点两条 DOM/xpath 路径的序列编辑距离（Levenshtein）或路径重合度，也可用最长公共祖先深度归一化；若对元素子树整体度量才用树编辑距离（tree edit distance）", "语义相关性＝元素周边文本（或 aria-label/标题）embedding 与查询意图 embedding 的余弦", "噪声抗性＝对页面扰动（增删无关节点、改 class 后缀、注入广告 div）后 selector 是否仍命中同一元素，用命中保持率量化", "阈值诚实说明是自己标注的一批页面上调出的经验值，或坦白只有一两个真落成打分公式、另一个是启发式，而非硬报一个漂亮数字", "selector 必回放到真实渲染 DOM（Puppeteer page.$$／jsdom querySelectorAll）执行：命中 0 触发带反馈的重生成，命中多个用预期文本/属性/nth-of-type/结构路径二次过滤或让 LLM 裁决，并对命中元素做内容断言而非只看数量", "分层解析入队 DOM 节点，BFS 按层展开，切分终止条件是子树序列化 token 数≤阈值（留出 prompt＋输出余量约 6~8k），超阈值递归下潜，每个 chunk 带 root 到该节点的祖先标签＋关键属性 breadcrumb，先做属性裁剪（去 style/内联 script/base64）压体积", "幻觉双层防线：生成侧把子树真实出现的 tag/class/id 作受限词表放进 prompt 或只让模型输出路径决策由程序拼 selector；执行侧回放兜底，并能给测试集规模、命中率/最终成功率、静态与动态页分层数据"], "pass": ["三指标至少给得出输入是什么、和谁比、用什么度量，阈值来源诚实（标注集调出/部分是启发式）", "selector 一定回放真实 DOM 校验，命中 0/命中多有明确分支", "分层解析的入队单元、切分终止条件、祖先上下文保留自洽", "拿得出命中率/成功率数字，或诚实承认只是原型量级"], "tell": "三指标只能重复中文名词或翻成英文，给不出度量与阈值出处；张口报「相似度 0.85 以上」却说不清怎么标定、在多少页面验证过；「LLM 生成的 selector 准确率很高基本不用验证」；分层解析被追问就改口成固定字符数滑窗；用「稳定性大幅提升」这类无基线形容词搪塞。", "probe": "简历写「复杂企业文档场景下的稳定性与鲁棒性」——企业文档具体指哪类页面（登录后系统／PDF 转 HTML／内网报表）、样本从哪来、该场景成功率多少？如果没有真实数据支撑，你愿意把这句改成什么更准确的表述？"}, {"n": "Q6", "title": "云原生 ownership：探针配置与密钥管理", "anchor": "「参与 K8s＋Google Cloud 部署维护」「Cloud Run 部署」「多 Provider 请求转发」隐含的上游 Key 管理", "ladder": [{"level": "L1 项目切入", "q": "Exec-Layer 放 K8s、Sorin 放 Cloud Run，同一家公司两套运行时，当初为什么这么分？两个服务的流量形态、扩缩容需求、冷启动容忍度差在哪？"}, {"level": "L2 设计决策", "q": "Exec-Layer 是转发层，它的 Deployment 你会写哪些关键字段——replicas 定多少、requests/limits 的 CPU 与内存各给多少、依据是什么？"}], "ask": "readiness 和 liveness 探针分别探哪个端点、失败几次才算挂、initialDelay 给多少、为什么这么设？另外上游各家 provider 的 API Key 在 K8s 里怎么存、怎么注入进容器、怎么轮换？一把上游 Key 泄露了，你的回收流程是什么？", "good": ["requests（调度依据/保证值）与 limits（上限，超内存会 OOMKill）区别清楚，数值有依据（内存 limit＝观察峰值＋余量）", "readiness 探轻量 /healthz 且不依赖上游、liveness 探进程存活避免误杀，两者不指向同一个重接口", "initialDelaySeconds 要盖住应用启动时间，failureThreshold 不能太敏感否则滚动更新抖动，能说清 periodSeconds", "K8s Secret 默认只是 base64 非加密，需开 etcd 加密或用 GCP Secret Manager，配 Workload Identity 让 Pod 免密钥访问 GCP，通过 env 或挂载 volume 注入", "轮换靠 Secret Manager 更新版本＋滚动重启；泄露时先在上游控制台吊销旧 Key、更新新版本、滚动重启摘掉旧 Key", "区分自家发给用户的 API Key 与上游 Provider Key 是两套东西、存储策略不同", "转发层瓶颈多在 I/O 等上游、CPU 利用率低，纯按 CPU 扩 HPA 不灵，应按并发数/in-flight 请求等自定义指标扩，或诚实说固定副本手动调；回滚 K8s 用 kubectl rollout undo，Cloud Run 靠切流回上一个 revision"], "pass": ["requests 与 limits 的区别、readiness 与 liveness 的区别都答对", "探针参数（initialDelay/failureThreshold）能给具体值与理由", "知道 K8s Secret 只是 base64、需外部方案，轮换与泄露回收有流程", "区分自家用户 Key 与上游 Provider Key"], "tell": "把 readiness 和 liveness 说成一回事、或都指向同一个重接口；以为 K8s Secret 是加密的、把 Key 塞环境变量或配置文件；探针只会说「配了健康检查」；HPA 张口「CPU 70%」却不知对 I/O 密集转发层不灵；把自家用户 Key 和上游 Provider Key 混为一谈。", "probe": "讲一次真实的线上发布事故或回滚——发布策略是滚动/蓝绿/金丝雀？某次转发层上线后开始报错或延迟飙升，你怎么第一时间发现的、K8s 层面敲了什么命令、Cloud Run 那边又怎么回？"}], "probes": [{"tag": "身份核验", "q": "把三段经历的性质讲清楚：Sahara AI 是全职吗（约 8 个月）？Capisoft 与绿盟都落在你 2022-09 至 2025-08 的硕士就读窗口内，分别是兼职、研究还是暑期实习？简历上的「2 年 Agent 开发」是怎么算出来的？"}, {"tag": "LLM Gateway", "q": "API Key 从生成到入库到校验的完整链路：库里到底存明文还是哈希？用户下次登录还能不能看到完整 Key？校验一次请求时你怎么用 O(1) 定位到是哪个用户、而不是把全表 Key 拉出来逐个比对？前缀设计有什么用？"}, {"tag": "LLM Gateway", "q": "OpenAI、Anthropic、Gemini 请求体差异很大——Anthropic 的 system 是顶层独立字段、role 只有 user/assistant、max_tokens 必填。你的统一层怎么抹平这些？是自己写的适配层还是基于 LiteLLM 二次开发？诚实说基于开源改是加分。"}, {"tag": "LLM Gateway", "q": "上游某 provider 突发 5xx 或超时，你的 failover 怎么设计——同 provider 重试还是切备用？如果已经开始流式返回了一半才断，还能不能 failover，为什么？重试怎么保证幂等、避免重复计费？"}, {"tag": "可观测性", "q": "那次 Memory Leak 最后定位到的泄漏对象具体是什么？在 FastAPI＋多 Provider 异步转发里，是每请求新建 httpx.AsyncClient 未复用未关、未 await 的 background task 堆积、还是全局无界缓存？引用链为什么让对象活着不释放？修完怎么验证不复发、在监控里加了什么护栏？"}, {"tag": "可观测性", "q": "如果泄漏很慢、要几天才 OOM 一次，你在 CI 或预发环境怎么在几十分钟内就复现并证明修好了？光靠生产观察够不够？你怎么区分「真泄漏（内存单调上升最终 OOM）」和「高并发下的正常高水位（涨上去会回落）」——看的是哪条曲线、什么形状？"}, {"tag": "Agent", "q": "被下载的 Skill 到底是纯配置还是含可执行 Python 代码？下载后主 Agent 怎么信任并执行它，是在沙箱/独立进程还是直接在主进程 exec？一个 Skill 要读市场数据的 API Key，凭证是打包进 Skill 还是主 Agent 注入，Skill 能不能越权拿到别的凭证？"}, {"tag": "Agent", "q": "金融数据源具体是哪些 API？多个源数据不一致时以谁为准？行情有延迟、限流、偶发缺口，你在 tool 层的重试退避、超时、缓存 TTL 分别设成多少、为什么是这个值？分析里用的价格是什么时刻的，你怎么把时间戳传给用户避免「以为是实时」的误导？"}, {"tag": "抓取", "q": "面对 JS 动态渲染页面，Puppeteer 在哪一步介入——所有页面都先 headless 渲染，还是先试静态 HTML、检测到某信号才升级到浏览器？这个判定信号是什么？你怎么知道页面渲染完了（waitForSelector/networkidle 还是裸 sleep）？靠滚动或点击「加载更多」才懒加载出来的目标怎么覆盖？"}, {"tag": "抓取", "q": "更隐蔽的幻觉：selector 语法合法、也真命中了一个元素，但命中的是错的那个（语义层幻觉），回放命中数＝1 完全兜不住。这种「合法且命中但选错」的错误你怎么发现、怎么量化它在你系统里的占比？"}, {"tag": "异步编排", "q": "asyncio.gather 里第二个 tool 抛异常，其余还在飞的 task 会怎样？如果你希望其余 task 被取消并清理，和希望它们跑完拿部分结果，代码写法有什么区别？并发放大后怎么防止把上游 rate limit 打爆？"}, {"tag": "云原生", "q": "Signoz 自托管要自己在集群里跑 ClickHouse＋OTel Collector，这套是你部署的吗？采样是头采样还是尾采样、为什么？ClickHouse 的 TTL/保留期与存储成本怎么权衡？迁移期新旧两套怎么并行、对比数据一致后再切、避免丢数据？"}], "_factcheck": "整体技术准确度很高，属于经得起对抗式核查的答案键，绝大多数 good/pass 条目均正确且措辞审慎（阈值来源诚实、承认自估偏差、区分平台层 concurrency 与事件循环并发、区分自家 Key 与上游 Provider Key 等）。核对无误的要点包括：OpenAI 流需 stream_options.include_usage 且 usage 在末帧、tiktoken 仅对 OpenAI 系准、Redis 原子计数与预扣-结算、OTLP 4317/4318 与 Collector 三段 pipeline、高基数维度不进 metric label、Cloud Run 请求超时最长 60 分钟/默认 5 分钟且 container concurrency 默认 80、同步阻塞卡死事件循环、K8s Secret 仅 base64 需外部加密、requests/limits 与 readiness/liveness 区别、I/O 密集转发层按 CPU 扩 HPA 不灵。仅发现两处轻微不精确（均不影响结论方向）：Q3 把四类超时错挂到 httpx.Limits、Q5 对线性路径误用「树编辑距离」。此外可留意 Q1「ask」框定里「非 OpenAI 兼容 provider 干脆不给 usage」偏绝对——Anthropic 原生流式（message_start/message_delta）与多数 OpenAI 兼容后端（vLLM/Together 等）现已回传 usage，但该表述位于提问框定而非 good/pass，故不计为评分点错误。建议仅修订上述两条 good 措辞，其余保留。", "weakness": {"summary": "主线清晰：一段与AI Infra高度对口的LLM网关生产经历，加上两段在读期间的研究与实习。最大的风险不在技术方向，而在三处会被重点追问的表述：标题里「2年」的经验口径、项目二通篇「参与」导致本人职责不清、项目三的评估机制没有评测口径。先改这三处，其余是表达层面的问题。", "keep": ["LLM网关Exec-Layer的生产经历与岗位直接相关：多Provider统一转发、Token用量与推理成本统计、QPS监控是全简历最有说服力的部分，修改时保留这些具体名词。", "成果几乎没有堆砌没有基线的百分比，表述克制；改写时不要为了好看加入无法核验的数字。", "Datadog迁移到Signoz、生产环境Memory Leak排查这类工程动作具体，可以在面试中展开验证。"], "actions": ["标题去掉合并计算的「2年」，每段经历写明起止年月和性质（全职、兼职、实习）。", "项目二逐条写出本人负责的模块或Agent Tool，用具体动作替换「参与」。", "项目三给评估机制写明数据与结果；没有评测数据就改写成设计思路，不写成已验证的结论。", "技能栏只保留项目里用过或能讲清楚的技术，Redis、ClickHouse找到出处再放进「熟练」。"], "items": [{"id": "W1", "severity": "high", "category": "经验年限口径", "quote": "Agent 开发工程师(2年)", "issue": "全职工程经历只有Sahara AI一段（2025-09至2026-05，约8个月）；Capisoft（2024-12至2025-06）与绿盟实习（2024-07至2024-09）都在硕士就读期间（2022-09至2025-08）。「2年」是把在读经历合并计算的结果。", "why": "面试官对照时间线时会发现口径不一致，容易把后面的表述都按“可能有夸大”来读。按初级候选人评估本身不吃亏，口径不清才会影响可信度。", "followups": [{"q": "你写的是2年经验，能按时间顺序说说每一段是全职、兼职还是实习吗？", "answer": "可以。全职只有Sahara AI这一段，2025-09到2026-05，做LLM网关。之前两段都在硕士就读期间：绿盟是2024-07到2024-09的暑期实习；Capisoft是2024-12到2025-06，性质是【待补充：兼职、研究还是全职，以及每周投入时间】。简历上的「2年」是把这几段合在一起算的，严格按全职算是8个月左右。这几段做的都是后端和LLM应用，我更希望按实际做过的内容来评估。", "when": "看到标题里的年限，或发现经历与就读时间重叠时。"}], "fix": "标题去掉年限，或写成「全职约8个月＋在读期间经历2段」；每段经历写明起止年月和性质（全职、兼职、实习）。", "rewrite": "Agent/AI Infra后端工程师｜Sahara AI全职（2025-09至2026-05）｜在读期间经历2段"}, {"id": "W2", "severity": "high", "category": "本人职责不清（项目二Sorin）", "quote": "参与开发……参与部署……参与 Cloud Run 运行维护", "issue": "整段几乎都是「参与」，看不出哪些Agent Tool、哪些代码由本人完成，也看不出本人在部署中负责什么。", "why": "面试官会把这段当作团队项目，默认个人贡献偏小，并逐项追问“你具体写了哪部分”。如果到面试时才说清，会显得简历和实际不一致。", "followups": [{"q": "Sorin里你自己负责的是哪几个模块或Agent Tool？挑一个讲讲设计取舍。", "answer": "我负责的是【待补充：模块或Tool名称】，从设计、实现到测试都是我写的；部署方面我做的是【待补充：具体工作】，Cloud Run的整体方案不是我定的。挑一个讲的话，我会讲【待补充：最有把握的Tool】：它要解决的问题、为什么拆成独立的Skill、遇到的最大困难和我的处理办法。", "when": "看到「参与」类表述时。"}, {"q": "「可模块化打包的Agent Skill架构」是你设计的，还是在已有方案上实现的？", "answer": "整体方案是【待补充：团队或负责人】定的，我按这个方案实现了【待补充：哪些Skill】，自己做的改进是【待补充：改进点】。这个架构的好处是每个Skill可以单独测试和替换；代价是Skill之间需要共享上下文时要额外设计接口。", "when": "候选人把架构说成本人设计时。"}], "fix": "每条写成「动作＋对象＋本人范围」，例如「独立实现X、Y两个Agent Tool，负责接口设计与测试」；部署部分写清本人做了什么，没做过的不写。", "rewrite": "独立实现【待补充：Tool名称】等【待补充：数量】个Agent Tool，负责【待补充：本人负责的环节】；在Cloud Run部署中负责【待补充：具体工作】。"}, {"id": "W3", "severity": "medium", "category": "评估机制没有口径（项目三）", "quote": "多维度 Selector 评估（结构相似度/语义相关性/噪声抗性）；基于队列的 HTML 分层解析算法", "issue": "三个评估维度只有名称，没有数据集、样本量、计算方法和结果；“算法”一词也没有说明与常规分层遍历的区别。", "why": "面试官会请你逐个给出指标的计算方法和实测结果。给不出时，这一段会被当成概念描述，连带影响对项目完成度的判断。", "followups": [{"q": "结构相似度、语义相关性、噪声抗性分别怎么计算？在多少页面上评过，结果如何？", "answer": "结构相似度是【待补充：计算方法】，语义相关性是【待补充：计算方法】，噪声抗性是【待补充：计算方法】。评测用了【待补充：站点与页面数量及来源】，结果是【待补充：结果】。如果当时没有做系统评测，我会直接说明：这三个维度是设计时的筛选标准，验证方式是【待补充：实际验证方式】。", "when": "候选人提到评估机制或说效果好时。"}, {"q": "为什么要基于队列做分层解析？和直接递归遍历DOM相比有什么好处？", "answer": "用队列做的是按层的广度优先遍历，可以先处理靠近根部、结构信息集中的区块，再配合分块控制每次送给LLM的内容长度，避免深层嵌套一次放进太多内容；代价是同一内容可能被拆到不同批次，合并结果时要去重。我们具体的分层规则是【待补充：规则】。", "when": "简历出现「算法」「机制」这类词时。"}], "fix": "写出评测设置与结果，例如在多少站点、多少页面上验证，回放命中率多少；没有评测数据就改写成设计思路，不用暗示已验证的词。", "rewrite": "设计结构相似度、语义相关性与噪声抗性三项指标，筛选LLM生成的CSS Selector；在【待补充：站点与页面数量】上验证，回放命中率【待补充：结果】。"}, {"id": "W4", "severity": "medium", "category": "技能栏与项目对不上", "quote": "个人技能：Redis、ClickHouse", "issue": "两项技术只出现在技能栏；三个项目里用到的数据库是PostgreSQL和InfluxDB。", "why": "面试官常从技能栏挑没有项目出处的词来问，例如Redis的持久化方式、ClickHouse的表引擎。答不上来会让人怀疑整个技能栏的可信度。", "followups": [{"q": "你在哪里用过ClickHouse？用它解决了什么问题？", "answer": "我是在【待补充：项目、课程或自学场景】里用的ClickHouse，用来【待补充：存储或分析的数据】。项目里的监控指标最终放在InfluxDB，是因为【待补充：原因】。", "when": "简历的技能与项目对不上时。"}], "fix": "技能按熟练程度分组，只把项目里用过的技术放在「熟练」；Redis、ClickHouse在项目里找到出处就写进对应条目，找不到就移到「了解」。", "rewrite": "熟练：Python、FastAPI（异步）、PostgreSQL、InfluxDB、Kubernetes、Cloud Run、Signoz、Langfuse；了解：Redis、ClickHouse"}, {"id": "W5", "severity": "medium", "category": "自研与开源的边界（Exec-Layer）", "quote": "多 Provider 统一转发；建立 QPS、Token Usage、Inference Cost 监控", "issue": "这些能力与开源LLM网关（如LiteLLM）的功能高度重合，简历没有说明是自研、基于开源二次开发，还是集成现有组件。", "why": "面试官一定会问哪部分是自己写的。主动说明基于开源改造并讲清改了什么是加分；说不清楚，容易被理解成把开源能力当成自研。", "followups": [{"q": "Exec-Layer是从零写的，还是基于LiteLLM之类的开源网关？改了哪些地方？", "answer": "Exec-Layer是【待补充：自研，或基于某个开源项目】。我们在原有基础上改了【待补充：改动，例如计费口径、鉴权或流式计量】，原因是【待补充：原因】。我本人负责的是【待补充：本人负责部分】。", "when": "候选人强调网关能力时。"}, {"q": "流式返回时Token用量怎么统计？上游没有返回usage怎么办？", "answer": "有的上游会在流的最后一个数据块里带usage，有就以它为准；没有的话，用与模型匹配的分词器按输入和累计输出估算，并把这类记录标成估算值，对账时与上游账单核对差异。我们当时的做法是【待补充：实际做法】。", "when": "继续追问计量细节时。"}], "fix": "在条目里写明实现方式（自研，或基于哪个开源项目二次开发）和本人负责的部分。", "rewrite": "基于【待补充：自研或开源项目】实现LLM网关Exec-Layer：统一转发【待补充：数量】家模型服务商的请求，按请求统计Token用量与推理成本，建立QPS监控；本人负责【待补充：模块】。"}, {"id": "W6", "severity": "low", "category": "结果缺少规模与基线", "quote": "提升可观测性；支撑生产流量", "issue": "成果是定性描述，看不出规模（请求量、接入服务数）和改进前后的差别。", "why": "定性写法本身诚实，但面试官无法判断工作量和难度，往往会当场追问规模；写出可核验的规模信息会更有说服力。", "followups": [{"q": "网关大概承载多大的流量？迁移到Signoz后，排查问题的方式有什么变化？", "answer": "网关的峰值大约是【待补充：QPS或日请求量】，接入了【待补充：服务或租户数量】。迁移前用Datadog，换掉它的原因是【待补充：迁移原因】；迁移后指标、链路和日志在同一套系统里查看，【待补充：迁移后的具体变化】。", "when": "简历没有规模信息时。"}], "fix": "只写能核验的规模和对比，例如请求量、接入服务数、迁移前后的成本或告警时延；拿不到数字就写清范围和对象，不编造百分比。", "rewrite": "完成Datadog到Signoz的可观测性迁移，覆盖【待补充：服务数量】个服务的指标、链路与日志；【待补充：迁移后可核验的变化】。"}]}, "resume_opt": {"summary": "改写原则：不改变事实，把「参与」改成本人负责的范围，写出实现方式、规模和验证方法；时间线把全职与在读经历分开。下面6个问题的答案决定改写后的数字和措辞，回答后占位符会替换成真实信息。", "questions": [{"id": "A1", "q": "Capisoft那段（2024-12至2025-06）是兼职、研究还是全职，每周投入多少时间？Sorin和网页抽取两个项目分别属于哪段经历？", "why": "决定时间线、标题口径和项目归属怎么写。", "affects": ["E1", "E5", "E6"]}, {"id": "A2", "q": "Exec-Layer是自研，还是基于LiteLLM等开源项目二次开发？你本人负责哪些模块？", "why": "决定网关条目怎么写，也是面试必问点。", "affects": ["E2"]}, {"id": "A3", "q": "网关的规模：峰值QPS或日请求量、接入几家模型服务商、覆盖多少个内部服务？", "why": "让网关与可观测性两条有可核验的规模信息。", "affects": ["E2", "E3"]}, {"id": "A4", "q": "Sorin项目里你独立完成的模块或Agent Tool有哪些？部署上线时你具体做了什么？", "why": "用本人职责替换「参与」。", "affects": ["E5"]}, {"id": "A5", "q": "项目三的Selector评估用了什么数据（站点数、页面数），结果如何？", "why": "没有评测数据时，需要改成设计思路的写法。", "affects": ["E6"]}, {"id": "A6", "q": "Redis、ClickHouse在哪个项目或场景里用过？", "why": "决定它们放在「熟练」还是「了解」。", "affects": ["E7"]}], "edits": [{"id": "E1", "section": "标题", "before": "Agent 开发工程师(2年)", "after": "Agent/AI Infra后端工程师｜Sahara AI全职（2025-09至2026-05）｜在读期间经历2段", "why": "去掉合并计算的年限，按经历性质写，面试时口径一致。"}, {"id": "E2", "section": "项目一 · LLM网关", "before": "多 Provider 统一转发；建立 QPS、Token Usage、Inference Cost 监控", "after": "基于【待补充：自研或开源项目】实现LLM网关Exec-Layer，统一转发【待补充：数量】家模型服务商的请求，按请求统计Token用量与推理成本，建立QPS监控；本人负责【待补充：模块】。", "why": "写清实现方式、规模和本人范围，提前回答“是不是自研”。"}, {"id": "E3", "section": "项目一 · 可观测性", "before": "Datadog→Signoz 迁移；提升可观测性", "after": "完成Datadog到Signoz的可观测性迁移，覆盖【待补充：服务数量】个服务的指标、链路与日志；【待补充：迁移后可核验的变化，例如告警或排障时间】。", "why": "用范围和可核验的变化替换“提升可观测性”。"}, {"id": "E4     <details class="ans" open>
      <summary>${esc(L.ans_summary)}</summary>
      ${paired?"":`<div class="blk good"><div class="bt">${esc(L.good_h)}</div><ul>${li(c.good)}</ul></div>`}
      <div class="blk pass"><div class="bt">${esc(L.pass_bt)}</div><ul>${li(c.pass)}</ul></div>
      <div class="blk tell"><div class="bt">${esc(L.tell_h)}</div><p>${fmt(c.tell)}</p></div>
    </details>
  </article>`;
}
function renderCand(d){
  const rlink = d.resume ? `<a class="rlink" href="${esc(d.resume)}">${esc(L.resume_link)}</a>` : "";
  const flags = (d.flags||[]).map(f=>`<li>${fmt(f)}</li>`).join("");
  const strengths = (d.strengths||[]).map(s=>`<li>${fmt(s)}</li>`).join("");
  const o = d.opener||{};
  const oq = (o.questions||[]).map(q=>`<li>${fmt(q)}</li>`).join("");
  const opener = o.title ? `<article class="card">
    <div class="card-h"><span class="badge behav">${esc(L.opener_badge)}</span><h3>${esc(o.title)}</h3></div>
    <div class="ask"><ul style="margin:0;padding-left:18px">${oq}</ul></div>
    <div class="behav-note"><b>${esc(L.opener_expect)}${esc(L.colon)}</b>${fmt(o.expect)}<br><b>${esc(L.opener_tell)}${esc(L.colon)}</b>${fmt(o.tell)}</div>
  </article>` : "";
  const cards = (d.cards||[]).map(renderCard).join("");
  const probes = (d.probes||[]).map(p=>`<li><span class="pt">${esc(p.tag)}</span>${fmt(p.q)}${pairedAnswer(p.answer)}</li>`).join("");
  const probesBlock = (d.probes||[]).length ? `<details class="probes"><summary>${esc(L.probes_pre)}${d.probes.length}${esc(L.probes_post)}</summary><ul>${probes}</ul></details>` : "";
  return `<div class="profile">
      <h2>${esc(d.name)}${rlink}</h2>
      <p>${fmt(d.profile)}</p>
      ${d.ruler?`<div class="ruler">${fmt(d.ruler)}</div>`:""}
      ${(d.strengths||[]).length?`<div class="stitle s-good">${esc(L.strengths_title)}</div><ul class="strengths">${strengths}</ul>`:""}
      ${(d.flags||[]).length?`<div class="stitle s-flag">${esc(L.flags_title)}</div><ul class="flags">${flags}</ul>`:""}
    </div>${opener}${cards}${probesBlock}`;
}

const sections = document.getElementById("sections");
sections.innerHTML = ids.map((id,i)=>
  `<section data-sec="${esc(id)}" class="${i===0?'':'hide'}">${renderCand(cands[id])}</section>`).join("");
document.getElementById("foot").innerHTML =
  `<div>${esc(meta.footer || L.footer_default)}</div><div class="brand">resume-grill</div>`;

document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");
  const c=t.dataset.c;
  document.querySelectorAll("[data-sec]").forEach(s=>s.classList.toggle("hide", s.dataset.sec!==c));
  window.scrollTo({top:0});
}));
const tgl = document.getElementById("toggleAll");
let open = true;
tgl.textContent = L.collapse_all;
tgl.addEventListener("click",()=>{
  open=!open;
  document.querySelectorAll("details.ans, details.paired-answer").forEach(d=>d.open=open);
  tgl.textContent = open ? L.collapse_all : L.expand_all;
});
// Export PDF = the browser's print dialog ("Save as PDF"); answers are expanded while printing.
const exp = document.getElementById("exportPdf");
exp.textContent = L.export_pdf || "PDF";
exp.title = L.export_pdf_hint || "";
exp.addEventListener("click", ()=>window.print());
let reopened = [];
window.addEventListener("beforeprint", ()=>{
  reopened = [];
  document.querySelectorAll("details:not([open])").forEach(d=>{ d.open = true; reopened.push(d); });
});
window.addEventListener("afterprint", ()=>{ reopened.forEach(d=>{ d.open = false; }); reopened = []; });
</script>
